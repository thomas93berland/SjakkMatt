<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Chess Lounge | Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #e6bd78;
      --gold-soft: #f3d9a6;
      --gold-dark: #9a652d;
      --cream: #fff1d8;
      --muted: #c9ad86;
      --wood: #3a1f0f;
      --wood-dark: #140907;
      --panel: rgba(32, 17, 8, 0.86);
      --border: rgba(230, 189, 120, 0.55);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      background: #050302;
    }

    body {
      min-height: 100vh;
      padding: 18px;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 16% 12%, rgba(255, 115, 35, 0.32), transparent 18%),
        radial-gradient(circle at 80% 15%, rgba(255, 190, 90, 0.18), transparent 18%),
        radial-gradient(circle at 50% 8%, rgba(255, 210, 140, 0.13), transparent 24%),
        linear-gradient(rgba(4, 2, 1, 0.18), rgba(4, 2, 1, 0.82)),
        repeating-linear-gradient(
          90deg,
          rgba(90, 49, 20, 0.18) 0px,
          rgba(90, 49, 20, 0.18) 18px,
          rgba(35, 17, 8, 0.22) 18px,
          rgba(35, 17, 8, 0.22) 36px
        ),
        linear-gradient(135deg, #0b0503 0%, #2b1208 45%, #070302 100%);
    }

    .page-frame {
      min-height: calc(100vh - 36px);
      max-width: 1120px;
      margin: 0 auto;
      position: relative;
      border: 2px solid rgba(230, 189, 120, 0.78);
      border-radius: 28px;
      padding: 28px;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(0, 0, 0, 0.75),
        inset 0 0 40px rgba(230, 158, 70, 0.07);
    }

    .page-frame::before,
    .page-frame::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(230, 189, 120, 0.32);
      border-radius: 22px;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 54px;
      height: 54px;
      border-color: var(--gold);
      opacity: 0.85;
      pointer-events: none;
      z-index: 3;
    }

    .corner.tl {
      top: 14px;
      left: 14px;
      border-top: 2px solid;
      border-left: 2px solid;
      border-top-left-radius: 22px;
    }

    .corner.tr {
      top: 14px;
      right: 14px;
      border-top: 2px solid;
      border-right: 2px solid;
      border-top-right-radius: 22px;
    }

    .corner.bl {
      bottom: 14px;
      left: 14px;
      border-bottom: 2px solid;
      border-left: 2px solid;
      border-bottom-left-radius: 22px;
    }

    .corner.br {
      bottom: 14px;
      right: 14px;
      border-bottom: 2px solid;
      border-right: 2px solid;
      border-bottom-right-radius: 22px;
    }

    .hero {
      position: relative;
      min-height: 360px;
      border-radius: 22px;
      padding: 34px 24px 20px;
      display: flex;
      align-items: end;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 26px;
      background:
        linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.62)),
        radial-gradient(circle at 12% 28%, rgba(255, 105, 28, 0.75), transparent 12%),
        radial-gradient(circle at 18% 30%, rgba(255, 192, 74, 0.30), transparent 21%),
        radial-gradient(circle at 82% 26%, rgba(255, 198, 92, 0.22), transparent 16%),
        linear-gradient(120deg, #120806 0%, #2f1b0e 42%, #090403 100%);
      box-shadow: inset 0 -80px 90px rgba(0,0,0,0.65);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 54px 54px;
      opacity: 0.35;
    }

    .fireplace {
      position: absolute;
      left: 28px;
      top: 48px;
      width: 220px;
      height: 180px;
      border-radius: 100px 100px 18px 18px;
      border: 8px solid rgba(66, 35, 20, 0.95);
      background:
        radial-gradient(circle at 50% 85%, rgba(255, 230, 120, 0.95), transparent 12%),
        radial-gradient(circle at 44% 72%, rgba(255, 118, 31, 0.92), transparent 19%),
        radial-gradient(circle at 58% 70%, rgba(255, 176, 45, 0.72), transparent 22%),
        linear-gradient(#1b0d08, #080302);
      box-shadow:
        0 0 45px rgba(255, 112, 28, 0.35),
        inset 0 0 22px rgba(0,0,0,0.72);
      opacity: 0.78;
    }

    .lounge-chair {
      position: absolute;
      right: 80px;
      top: 88px;
      width: 230px;
      height: 120px;
      border-radius: 60px 60px 30px 30px;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.08), transparent 10%),
        radial-gradient(circle at 60% 38%, rgba(255,255,255,0.07), transparent 10%),
        linear-gradient(135deg, #4a2615, #170805);
      box-shadow: inset 0 12px 20px rgba(255,255,255,0.04), 0 18px 28px rgba(0,0,0,0.45);
      opacity: 0.76;
    }

    .lamp {
      position: absolute;
      right: 110px;
      top: 24px;
      width: 100px;
      height: 72px;
      border-radius: 50% 50% 18px 18px;
      background: linear-gradient(#1e130a, #e0b66f 40%, #1b0d05);
      clip-path: polygon(24% 0, 76% 0, 100% 100%, 0 100%);
      box-shadow: 0 25px 50px rgba(255, 197, 92, 0.34);
      opacity: 0.82;
    }

    .table-decor {
      position: absolute;
      right: 74px;
      bottom: 42px;
      width: 240px;
      height: 92px;
      transform: rotate(-3deg);
      border-radius: 14px;
      background:
        linear-gradient(45deg, rgba(255,255,255,0.08) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.08) 75%),
        linear-gradient(45deg, rgba(0,0,0,0.20) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.20) 75%),
        linear-gradient(135deg, #b77b3b, #4f260f);
      background-size: 34px 34px;
      background-position: 0 0, 17px 17px, 0 0;
      border: 1px solid rgba(255, 218, 150, 0.20);
      opacity: 0.78;
      box-shadow: 0 14px 25px rgba(0,0,0,0.42);
    }

    .cup {
      position: absolute;
      left: 168px;
      bottom: 60px;
      width: 110px;
      height: 70px;
      border-radius: 0 0 32px 32px;
      background: linear-gradient(135deg, #050302, #1a0b06);
      border: 1px solid rgba(230, 189, 120, 0.28);
      box-shadow: 0 12px 24px rgba(0,0,0,0.5);
      opacity: 0.88;
    }

    .cup::before {
      content: "";
      position: absolute;
      left: 20px;
      right: 20px;
      top: -10px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,245,220,0.14), rgba(0,0,0,0.85));
      border: 1px solid rgba(230, 189, 120, 0.18);
    }

    .cup::after {
      content: "♞";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 26px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
    }

    .emblem {
      width: 165px;
      height: 165px;
      margin: 0 auto 12px;
      border-radius: 999px;
      border: 2px solid rgba(230, 189, 120, 0.78);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, rgba(230, 189, 120, 0.10), transparent 58%),
        rgba(0,0,0,0.23);
      box-shadow:
        0 0 35px rgba(230, 189, 120, 0.16),
        inset 0 0 25px rgba(230, 189, 120, 0.06);
    }

    .emblem span {
      font-size: 86px;
      color: #f0cf93;
      text-shadow: 0 5px 18px rgba(0,0,0,0.6);
    }

    .hero-title {
      margin: 0;
      font-size: clamp(48px, 8vw, 92px);
      line-height: 0.86;
      font-weight: 400;
      letter-spacing: 1px;
      color: #f1d293;
      text-shadow:
        0 4px 12px rgba(0,0,0,0.82),
        0 0 20px rgba(230,189,120,0.18);
    }

    .hero-title small {
      display: block;
      font-size: 0.58em;
      margin-bottom: 2px;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 16px auto 12px;
      color: var(--gold);
      opacity: 0.88;
    }

    .ornament::before,
    .ornament::after {
      content: "";
      width: 140px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .ornament::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .tagline {
      margin: 0;
      color: #f4dcae;
      font-family: Arial, sans-serif;
      font-size: clamp(18px, 3.2vw, 28px);
      letter-spacing: 1px;
    }

    .login-card {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      padding: 42px clamp(22px, 7vw, 90px) 32px;
      border-radius: 28px;
      border: 2px solid rgba(230, 189, 120, 0.62);
      background:
        linear-gradient(rgba(20, 9, 3, 0.86), rgba(20, 9, 3, 0.88)),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.025) 0px,
          rgba(255,255,255,0.025) 1px,
          transparent 1px,
          transparent 7px
        ),
        linear-gradient(135deg, #3d1d0c, #1a0a04);
      box-shadow:
        0 22px 55px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 0 45px rgba(230, 155, 70, 0.06);
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 22px;
      border: 1px solid rgba(230, 189, 120, 0.20);
      pointer-events: none;
    }

    .card-head {
      text-align: center;
      position: relative;
      z-index: 1;
      margin-bottom: 34px;
    }

    .card-head h2 {
      margin: 0 0 12px;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 1;
      font-weight: 400;
      color: #fff4df;
      text-shadow: 0 4px 12px rgba(0,0,0,0.75);
    }

    .card-head p {
      margin: 0;
      color: #e5d0ad;
      font-family: Arial, sans-serif;
      font-size: clamp(18px, 3vw, 28px);
      line-height: 1.4;
    }

    .divider-icon {
      margin: 22px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--gold);
      font-size: 50px;
    }

    .divider-icon::before,
    .divider-icon::after {
      content: "";
      width: 170px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(230,189,120,0.78));
    }

    .divider-icon::after {
      background: linear-gradient(90deg, rgba(230,189,120,0.78), transparent);
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 24px;
      position: relative;
      z-index: 1;
    }

    .mode-tabs button {
      border: 1px solid rgba(230, 189, 120, 0.28);
      background: rgba(0,0,0,0.20);
      color: #f2d8a8;
      padding: 13px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .mode-tabs button.active {
      background: linear-gradient(135deg, #b46b27, #5d2c0f);
      color: #fff4df;
      box-shadow: 0 10px 20px rgba(0,0,0,0.28);
    }

    form {
      position: relative;
      z-index: 1;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #fff0d0;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 22px;
      letter-spacing: 0.2px;
    }

    .input-shell {
      display: grid;
      grid-template-columns: 64px 1fr 56px;
      align-items: center;
      min-height: 74px;
      border: 1.5px solid rgba(240, 210, 155, 0.72);
      border-radius: 14px;
      background: rgba(12, 7, 3, 0.52);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .input-shell.no-action {
      grid-template-columns: 64px 1fr;
    }

    .input-icon,
    .field-action {
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 30px;
    }

    .field-action {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #fff4df;
      font-family: Arial, sans-serif;
      font-size: 24px;
      padding: 18px 4px;
      min-width: 0;
    }

    input::placeholder {
      color: rgba(238, 218, 185, 0.72);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin: 8px 0 24px;
      font-family: Arial, sans-serif;
      color: #fff0d0;
      font-size: 20px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 18px;
      height: 18px;
      accent-color: #c47a2c;
    }

    .forgot {
      border: none;
      background: transparent;
      color: #f0ce8e;
      font-size: 20px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      padding: 0;
    }

    .primary-btn {
      width: 100%;
      min-height: 80px;
      border-radius: 14px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 82px 1fr 82px;
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      letter-spacing: 0.4px;
      transition: 0.18s ease;

      border: 1.5px solid rgba(255, 220, 160, 0.9);
      color: #fff4df;
      background:
        linear-gradient(rgba(255,255,255,0.06), rgba(0,0,0,0.14)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.05) 0px,
          rgba(255,255,255,0.05) 12px,
          transparent 12px,
          transparent 26px
        ),
        linear-gradient(135deg, #b86724, #6b2d0c);
      box-shadow:
        0 12px 24px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.14);
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .primary-btn span:first-child {
      color: #f8d99c;
      font-size: 42px;
    }

    .primary-btn span:last-child {
      color: #fff2cd;
      font-size: 46px;
    }

    .signup-line {
      margin: 28px 0 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 23px;
      color: #ead4b0;
    }

    .signup-line button {
      border: none;
      background: transparent;
      color: #ffd48e;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      padding: 0 0 0 12px;
    }

    #msg {
      margin-top: 18px;
      min-height: 24px;
      text-align: center;
      color: #ffd79c;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.4;
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .page-frame {
        min-height: calc(100vh - 20px);
        padding: 14px;
        border-radius: 22px;
      }

      .hero {
        min-height: 280px;
        padding: 24px 12px 18px;
      }

      .fireplace,
      .lounge-chair,
      .lamp,
      .table-decor,
      .cup {
        opacity: 0.44;
        transform: scale(0.8);
      }

      .fireplace {
        left: -14px;
        top: 34px;
      }

      .lounge-chair {
        right: -34px;
        top: 70px;
      }

      .table-decor {
        right: -28px;
        bottom: 38px;
      }

      .cup {
        left: 20px;
        bottom: 34px;
      }

      .emblem {
        width: 118px;
        height: 118px;
      }

      .emblem span {
        font-size: 62px;
      }

      .ornament::before,
      .ornament::after {
        width: 68px;
      }

      .login-card {
        padding: 30px 18px 24px;
      }

      .card-head h2 {
        font-size: 42px;
      }

      .card-head p {
        font-size: 18px;
      }

      .divider-icon {
        font-size: 36px;
      }

      .divider-icon::before,
      .divider-icon::after {
        width: 70px;
      }

      label {
        font-size: 17px;
      }

      .input-shell {
        min-height: 60px;
        grid-template-columns: 50px 1fr 46px;
      }

      .input-shell.no-action {
        grid-template-columns: 50px 1fr;
      }

      .input-icon,
      .field-action {
        font-size: 24px;
      }

      input {
        font-size: 17px;
        padding: 14px 2px;
      }

      .options {
        font-size: 15px;
      }

      .forgot {
        font-size: 15px;
      }

      .primary-btn {
        min-height: 62px;
        grid-template-columns: 58px 1fr 58px;
        font-size: 24px;
      }

      .signup-line {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="page-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <section class="hero">
      <div class="fireplace"></div>
      <div class="lounge-chair"></div>
      <div class="lamp"></div>
      <div class="table-decor"></div>
      <div class="cup"></div>

      <div class="hero-content">
        <div class="emblem">
          <span>♔</span>
        </div>

        <h1 class="hero-title">
          <small>The</small>
          Chess Lounge
        </h1>

        <div class="ornament">♘</div>

        <p class="tagline">A community. A passion. A lounge.</p>
      </div>
    </section>

    <section class="login-card">
      <div class="card-head">
        <h2 id="formTitle">Welcome back</h2>
        <p id="formSubtitle">
          Log in to your account and<br>
          continue your chess journey.
        </p>

        <div class="divider-icon">♟</div>
      </div>

      <div class="mode-tabs">
        <button type="button" id="loginModeBtn" class="active">Log in</button>
        <button type="button" id="registerModeBtn">Sign up</button>
      </div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label for="displayName">Display name</label>
          <div class="input-shell no-action">
            <div class="input-icon">♞</div>
            <input id="displayName" type="text" placeholder="Thomas93" autocomplete="nickname" />
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-shell no-action">
            <div class="input-icon">✉</div>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <div class="input-icon">🔒</div>
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" />
            <button class="field-action" type="button" id="togglePassword" aria-label="Vis/skjul passord">◉</button>
          </div>
        </div>

        <div class="options">
          <label class="remember">
            <input id="rememberMe" type="checkbox" checked />
            <span>♞ Remember me</span>
          </label>

          <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
        </div>

        <button class="primary-btn" type="submit" id="submitBtn">
          <span>♞</span>
          <strong>Log In</strong>
          <span>→</span>
        </button>

        <p class="signup-line">
          <span id="switchText">Don’t have an account?</span>
          <button type="button" id="switchModeBtn">Sign up</button>
        </p>

        <div id="msg"></div>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      updateProfile,
      sendPasswordResetEmail,
      browserLocalPersistence,
      browserSessionPersistence,
      setPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHVjtKQv1tZ8sV9MKOYSr05Y8rXxv-tLQ",
      authDomain: "berlands-sjakk.firebaseapp.com",
      databaseURL: "https://berlands-sjakk-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "berlands-sjakk",
      storageBucket: "berlands-sjakk.firebasestorage.app",
      messagingSenderId: "884597270594",
      appId: "1:884597270594:web:0284119adb9ceacc7ba5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginModeBtn = document.getElementById("loginModeBtn");
    const registerModeBtn = document.getElementById("registerModeBtn");
    const switchModeBtn = document.getElementById("switchModeBtn");
    const switchText = document.getElementById("switchText");

    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const nameField = document.getElementById("nameField");

    const authForm = document.getElementById("authForm");
    const submitBtn = document.getElementById("submitBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const togglePassword = document.getElementById("togglePassword");

    const displayNameInput = document.getElementById("displayName");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberMe = document.getElementById("rememberMe");
    const msg = document.getElementById("msg");

    let isRegisterMode = false;

    function goHome() {
      window.location.href = "./home.html";
    }

    function setMessage(text) {
      msg.textContent = text;
    }

    function friendlyError(error) {
      const code = error?.code || "";

      const messages = {
        "auth/invalid-email": "Ugyldig e-postadresse.",
        "auth/missing-password": "Skriv inn passord.",
        "auth/weak-password": "Passordet må ha minst 6 tegn.",
        "auth/email-already-in-use": "Denne e-posten er allerede registrert.",
        "auth/user-not-found": "Fant ingen bruker med denne e-posten.",
        "auth/wrong-password": "Feil passord.",
        "auth/invalid-credential": "Feil e-post eller passord.",
        "auth/unauthorized-domain": "Dette domenet er ikke godkjent i Firebase Authentication.",
        "auth/operation-not-allowed": "Denne innloggingsmetoden er ikke aktivert i Firebase."
      };

      return messages[code] || code || "Noe gikk galt.";
    }

    function setMode(registerMode) {
      isRegisterMode = registerMode;

      loginModeBtn.classList.toggle("active", !isRegisterMode);
      registerModeBtn.classList.toggle("active", isRegisterMode);

      nameField.style.display = isRegisterMode ? "block" : "none";

      formTitle.textContent = isRegisterMode ? "Create account" : "Welcome back";

      formSubtitle.innerHTML = isRegisterMode
        ? "Join The Chess Lounge and<br>start your chess journey."
        : "Log in to your account and<br>continue your chess journey.";

      submitBtn.querySelector("strong").textContent = isRegisterMode ? "Sign Up" : "Log In";

      switchText.textContent = isRegisterMode
        ? "Already have an account?"
        : "Don’t have an account?";

      switchModeBtn.textContent = isRegisterMode ? "Log in" : "Sign up";

      passwordInput.autocomplete = isRegisterMode ? "new-password" : "current-password";

      setMessage("");
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        setMessage("✅ Du er allerede innlogget. Sender deg videre...");
        setTimeout(goHome, 500);
      }
    });

    loginModeBtn.addEventListener("click", () => {
      setMode(false);
    });

    registerModeBtn.addEventListener("click", () => {
      setMode(true);
    });

    switchModeBtn.addEventListener("click", () => {
      setMode(!isRegisterMode);
    });

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "◌" : "◉";
    });

    forgotBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        setMessage("❌ Skriv inn e-postadressen din først.");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        setMessage("✅ Tilbakestilling av passord er sendt på e-post.");
      } catch (error) {
        setMessage("❌ " + friendlyError(error));
      }
    });

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = displayNameInput.value.trim();

      if (!email || !password) {
        setMessage("❌ Skriv inn e-post og passord.");
        return;
      }

      try {
        await setPersistence(
          auth,
          rememberMe.checked ? browserLocalPersistence : browserSessionPersistence
        );

        if (isRegisterMode) {
          setMessage("Oppretter bruker...");

          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          const name = displayName || email.split("@")[0];

          await updateProfile(user, {
            displayName: name
          });

          await set(ref(db, "users/" + user.uid), {
            uid: user.uid,
            name,
            email,
            elo: 800,
            wins: 0,
            losses: 0,
            draws: 0,
            bio: "",
            favoriteOpening: "",
            createdAt: serverTimestamp(),
            lastSeen: serverTimestamp()
          });

          setMessage("✅ Bruker opprettet. Sender deg videre...");
          setTimeout(goHome, 700);
        } else {
          setMessage("Logger inn...");

          await signInWithEmailAndPassword(auth, email, password);

          setMessage("✅ Innlogging vellykket. Sender deg videre...");
          setTimeout(goHome, 700);
        }
      } catch (error) {
        setMessage("❌ " + friendlyError(error));
      }
    });

    setMode(false);
  </script>
</body>
</html>
