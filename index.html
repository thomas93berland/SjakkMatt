<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Chess Lounge | Logg inn</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="login-page" data-page="login">
  <main class="login-shell">
    <section class="login-hero">
      <div class="brand-mark">♔</div>
      <h1>The Chess Lounge</h1>
      <p>En rolig og koselig plass for sjakk, venner og online kamper.</p>
    </section>
    <section class="login-card">
      <div class="login-header">
        <h2 id="formTitle">Velkommen tilbake</h2>
        <p id="formSubtitle">Logg inn og fortsett sjakkreisen din.</p>
      </div>
      <div class="auth-tabs">
        <button type="button" id="loginModeBtn" class="active">Logg inn</button>
        <button type="button" id="registerModeBtn">Registrer</button>
      </div>
      <form id="authForm">
        <div class="field" id="nameField" hidden>
          <label for="displayName">Visningsnavn</label>
          <input id="displayName" type="text" maxlength="30" placeholder="F.eks. Thomas93" autocomplete="nickname" />
        </div>
        <div class="field">
          <label for="email">E-post</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Passord</label>
          <div class="password-row">
            <input id="password" type="password" placeholder="Passord" autocomplete="current-password" />
            <button type="button" id="togglePassword" aria-label="Vis eller skjul passord">👁</button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember"><input id="rememberMe" type="checkbox" checked /> Husk meg</label>
          <button type="button" id="forgotBtn">Glemt passord?</button>
        </div>
        <button class="primary-btn full" type="submit" id="submitBtn">Logg inn</button>
        <p class="switch-line"><span id="switchText">Har du ikke bruker?</span> <button type="button" id="switchModeBtn">Registrer deg</button></p>
        <div id="msg" class="message"></div>
      </form>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
<link rel="stylesheet" href="./lounge-music.css" />
<script src="./lounge-music.js" defer></script>
</body>
</html>
