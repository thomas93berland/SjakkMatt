<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlands Sjakk | Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2b1600, #050505 45%),
        #050505;
      color: white;
      padding: 20px;
    }

    .app {
      max-width: 1050px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
      padding: 18px;
      border: 1px solid rgba(255, 140, 0, 0.35);
      border-radius: 18px;
      background: rgba(10, 10, 10, 0.9);
    }

    .logo {
      color: #ff8c00;
      font-size: 24px;
      font-weight: bold;
    }

    .logout {
      background: transparent;
      color: #ff8c00;
      border: 1px solid #ff8c00;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      margin-bottom: 30px;
    }

    .hero h1 {
      font-size: 34px;
      color: #ff8c00;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
    }

    .profile-card {
      background: #0d0d0d;
      border: 1px solid rgba(255, 140, 0, 0.4);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 0 25px rgba(255, 115, 0, 0.15);
    }

    .profile-card h2 {
      color: #ff8c00;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      background: #070707;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: #999;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 22px;
      color: white;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .menu-card {
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 18px;
      padding: 24px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      border-color: #ff8c00;
      box-shadow: 0 0 25px rgba(255, 115, 0, 0.18);
    }

    .menu-card h3 {
      color: #ff8c00;
      margin-bottom: 10px;
    }

    .menu-card p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 750px) {
      .stats,
      .menu {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">♟ Berlands Sjakk</div>
      <button class="logout" id="logoutBtn">Logg ut</button>
    </header>

    <section class="hero">
      <h1>Velkommen tilbake</h1>
      <p>Klar for å knuse vennene dine på brettet?</p>
    </section>

    <section class="profile-card">
      <h2 id="username">Spiller</h2>

      <div class="stats">
        <div class="stat">
          <span>Elo</span>
          <strong id="elo">800</strong>
        </div>

        <div class="stat">
          <span>Seire</span>
          <strong id="wins">0</strong>
        </div>

        <div class="stat">
          <span>Tap</span>
          <strong id="losses">0</strong>
        </div>

        <div class="stat">
          <span>Remis</span>
          <strong id="draws">0</strong>
        </div>
      </div>
    </section>

    <section class="menu">
      <div class="menu-card">
        <h3>🎮 Spill mot venn</h3>
        <p>Lag et rom og del romkode med en venn.</p>
      </div>

      <div class="menu-card">
        <h3>🏆 Rangliste</h3>
        <p>Se hvem som har høyest Elo-rating.</p>
      </div>

      <div class="menu-card">
        <h3>👤 Profil</h3>
        <p>Se statistikk, rating og kamp-historikk.</p>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBHVjtKQv1tZ8sV9MKOYSr05Y8rXxv-tLQ",
      authDomain: "berlands-sjakk.firebaseapp.com",
      databaseURL: "https://berlands-sjakk-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "berlands-sjakk",
      storageBucket: "berlands-sjakk.firebasestorage.app",
      messagingSenderId: "884597270594",
      appId: "1:884597270594:web:0284119adb9ceacc7ba5db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const usernameEl = document.getElementById("username");
    const logoutBtn = document.getElementById("logoutBtn");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        usernameEl.textContent = user.displayName || user.email || "Spiller";
      } else {
        window.location.href = "index.html";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
