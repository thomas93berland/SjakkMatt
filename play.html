<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chess Loungen | Spill</title>

  
  <style>
    html { background:#120b07; }
    body { margin:0; background:#120b07; color:#f7efe4; font-family:Arial,sans-serif; }
  </style>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="play-page">

  <div class="app">

    <header>
      <div class="logo">♟ <span>Chess</span> Loungen</div>

      <div class="top-buttons">
        <button type="button" class="small-btn" id="homeBtn">Hjem</button>
        <button type="button" class="small-btn" id="logoutBtn">Logg ut</button>
      </div>
    </header>

    <div class="layout">

      <main class="board-card">

        <div class="game-info">
          <div class="player-box">
            <span>Hvit</span>
            <strong id="whitePlayer">Venter...</strong>
          </div>

          <div class="player-box">
            <span>Svart</span>
            <strong id="blackPlayer">Venter...</strong>
          </div>
        </div>

        <div class="board-wrap">
          <div id="board"></div>
        </div>

      </main>

      <aside class="side-card">
        <h2>Online kamp</h2>

        <p>
          Lag et rom og del romkoden med en venn.
          Når vennen din blir med, trekkes hvit og svart tilfeldig.
        </p>

        <button type="button" class="main-btn" id="createRoomBtn">Lag nytt rom</button>

        <label for="joinCode">Bli med i rom</label>
        <input id="joinCode" placeholder="Skriv romkode" maxlength="5" autocomplete="off" />

        <button type="button" class="secondary-btn" id="joinRoomBtn">Bli med</button>

        <div class="room-box">
          <div>Romkode:</div>
          <div class="room-code" id="roomCode">------</div>
        </div>

        <div id="status">Laster sjakk...</div>

        <div class="moves" id="moves">
          <strong>Trekk:</strong><br>
          Ingen trekk enda.
        </div>
      </aside>

    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script type="module" src="./js/play.js"></script>
</body>
</html>
