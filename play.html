<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Chess Lounge | Spill</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./pieces.css" />
</head>

<body class="play-page" data-page="play">
  <main class="play-shell">
    <section class="game-area">
      <div class="game-top">
        <div class="player-pill">
          <span>Hvit</span>
          <strong id="whitePlayer">Venter...</strong>
          <em class="player-clock" id="whiteClock">15:00</em>
        </div>

        <div class="game-center">
          <div class="room-code-big" id="roomCode">-----</div>
          <div id="status" class="game-status">Laster sjakk...</div>
        </div>

        <div class="player-pill">
          <span>Svart</span>
          <strong id="blackPlayer">Venter...</strong>
          <em class="player-clock" id="blackClock">15:00</em>
        </div>
      </div>

      <div class="board-frame">
        <div id="board"></div>
      </div>
    </section>

    <aside class="play-drawer" id="playDrawer">
      <div class="drawer-head">
        <h2>Spillrom</h2>
        <button class="ghost-btn" id="closeDrawerBtn" type="button">×</button>
      </div>

      <button class="primary-btn full" id="createRoomBtn" type="button">Lag nytt rom</button>
      <button class="ghost-btn full sound-toggle" id="soundToggleBtn" type="button">Lyd: på</button>

      <label for="joinCode">Bli med i rom</label>
      <input id="joinCode" maxlength="5" placeholder="Romkode" autocomplete="off" />

      <button class="ghost-btn full" id="joinRoomBtn" type="button">Bli med</button>

      <div class="moves" id="moves">
        <strong>Trekk:</strong><br>
        Ingen trekk enda.
      </div>

      <button class="ghost-btn full" id="homeBtn" type="button">Til hjem</button>
      <button class="ghost-btn full" id="logoutBtn" type="button">Logg ut</button>
    </aside>

    <button class="floating-menu" id="openDrawerBtn" type="button">☰</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
(() => {
  const board = document.getElementById("board");
  if (!board || board.children.length) return;

  const files = ["a","b","c","d","e","f","g","h"];
  const ranks = ["8","7","6","5","4","3","2","1"];

  const pieces = {
    a8:["black","♜"], b8:["black","♞"], c8:["black","♝"], d8:["black","♛"], e8:["black","♚"], f8:["black","♝"], g8:["black","♞"], h8:["black","♜"],
    a7:["black","♟"], b7:["black","♟"], c7:["black","♟"], d7:["black","♟"], e7:["black","♟"], f7:["black","♟"], g7:["black","♟"], h7:["black","♟"],
    a2:["white","♙"], b2:["white","♙"], c2:["white","♙"], d2:["white","♙"], e2:["white","♙"], f2:["white","♙"], g2:["white","♙"], h2:["white","♙"],
    a1:["white","♖"], b1:["white","♘"], c1:["white","♗"], d1:["white","♕"], e1:["white","♔"], f1:["white","♗"], g1:["white","♘"], h1:["white","♖"]
  };

  board.style.display = "grid";
  board.style.gridTemplateColumns = "repeat(8, 1fr)";
  board.style.gridTemplateRows = "repeat(8, 1fr)";

  for (const rank of ranks) {
    for (const file of files) {
      const sq = file + rank;
      const cell = document.createElement("div");
      cell.className = "square " + (((files.indexOf(file) + Number(rank)) % 2 === 0) ? "dark" : "light");
      cell.style.display = "grid";
      cell.style.placeItems = "center";
      cell.style.aspectRatio = "1 / 1";

      if (pieces[sq]) {
        const [color, symbol] = pieces[sq];
        const p = document.createElement("div");
        p.textContent = symbol;
        p.style.fontFamily = "Georgia, serif";
        p.style.fontSize = "clamp(34px, 10vw, 82px)";
        p.style.lineHeight = "1";
        p.style.color = color === "white" ? "#f2d49a" : "#111";
        p.style.textShadow = color === "white"
          ? "0 4px 7px rgba(90,45,12,.45)"
          : "0 4px 8px rgba(0,0,0,.7)";
        cell.appendChild(p);
      }

      board.appendChild(cell);
    }
  }

  const status = document.getElementById("status");
  if (status && status.textContent === "Laster sjakk...") {
    status.textContent = "Brett klart. Sjekker innlogging...";
  }
})();
    </script>
  <script type="module" src="./app-v11.js"></script>
</body>
</html>
